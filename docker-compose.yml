
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assessment_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d assessment_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./app/backend
    environment:
      DATABASE_URL: postgresql://app_user:${POSTGRES_PASSWORD}@postgres:5432/assessment_db
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./app/frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
